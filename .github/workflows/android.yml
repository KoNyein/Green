name: Android build

on:
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Build a signed release AAB (requires protected signing secrets)"
        required: true
        default: false
        type: boolean

env:
  GRADLE_VERSION: "8.7"

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gwave-debug-apk-${{ github.run_number }}
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release-aab:
    name: Build signed release AAB
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Restore upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/gwave-upload.jks"
          chmod 600 "$RUNNER_TEMP/keys/gwave-upload.jks"

      - name: Build signed release AAB
        working-directory: android-app
        env:
          GWAVE_RELEASE_STORE_PASSWORD: ${{ secrets.GWAVE_RELEASE_STORE_PASSWORD }}
          GWAVE_RELEASE_KEY_ALIAS: ${{ secrets.GWAVE_RELEASE_KEY_ALIAS }}
          GWAVE_RELEASE_KEY_PASSWORD: ${{ secrets.GWAVE_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$GWAVE_RELEASE_STORE_PASSWORD"
          test -n "$GWAVE_RELEASE_KEY_ALIAS"
          test -n "$GWAVE_RELEASE_KEY_PASSWORD"
          gradle --no-daemon :app:bundleRelease \
            -PGWAVE_RELEASE_STORE_FILE="$RUNNER_TEMP/keys/gwave-upload.jks" \
            -PGWAVE_RELEASE_STORE_PASSWORD="$GWAVE_RELEASE_STORE_PASSWORD" \
            -PGWAVE_RELEASE_KEY_ALIAS="$GWAVE_RELEASE_KEY_ALIAS" \
            -PGWAVE_RELEASE_KEY_PASSWORD="$GWAVE_RELEASE_KEY_PASSWORD"

      - name: Upload release AAB and mapping
        uses: actions/upload-artifact@v4
        with:
          name: gwave-release-aab-${{ github.run_number }}
          path: |
            android-app/app/build/outputs/bundle/release/app-release.aab
            android-app/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
